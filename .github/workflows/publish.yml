name: publish

# Publish to PyPI via Trusted Publishing (OIDC) — no API token is stored.
# Pull requests and main pushes validate artifacts; version tags publish them.
on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run offline tests
        run: uv run --no-sync pytest -m "not network"

      - name: Validate package and release versions
        run: |
          uv run --no-sync python - <<'PYTHON'
          import json
          import os
          import runpy
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          module = runpy.run_path("src/vat_whitelist_mcp/__init__.py")
          registry = json.loads(Path("server.json").read_text())
          assert project["name"] == "vat-whitelist-mcp"
          assert module["__version__"] == registry["version"] == version
          assert registry["packages"][0]["identifier"] == project["name"]
          assert registry["packages"][0]["version"] == version
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag must match package version"
          print(f"Validated {project['name']} {version}")
          PYTHON

      - name: Build sdist and wheel
        run: uv build

      - name: Check installed wheel
        run: >-
          uv run --isolated --no-project --with ./dist/vat_whitelist_mcp-*.whl
          python -c "from importlib.metadata import version; from vat_whitelist_mcp.server import mcp; assert mcp.name == 'vat-whitelist'; print(version('vat-whitelist-mcp'))"

      - name: Validate distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vat-whitelist-mcp/
    permissions:
      id-token: write  # required for OIDC / Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-registry:
    name: Publish to MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC — proves this repo belongs to the SmartMobileHouse org
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Keep server.json in lockstep with the release, so only pyproject.toml
      # and __init__.py need a version bump per release.
      - name: Sync server.json to the release version
        run: |
          v='${{ steps.ver.outputs.version }}'
          tmp="$(mktemp)"
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' server.json > "$tmp"
          mv "$tmp" server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Give PyPI a moment to propagate the new version
        run: sleep 15

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
