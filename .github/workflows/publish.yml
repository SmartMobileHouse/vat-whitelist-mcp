name: publish

# Publish to PyPI via Trusted Publishing (OIDC) — no API token is stored.
# Triggers on pushing a semver tag (v1.2.3), or manually for the first release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

      - name: Ensure the git tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "git tag: $tag / pyproject: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Git tag v$tag does not match pyproject version $pkg"
            exit 1
          fi

      - name: Validate distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vat-whitelist-mcp/
    permissions:
      id-token: write  # required for OIDC / Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-registry:
    name: Publish to MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC — proves this repo belongs to the SmartMobileHouse org
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep -m1 -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Keep server.json in lockstep with the release, so only pyproject.toml
      # and __init__.py need a version bump per release.
      - name: Sync server.json to the release version
        run: |
          v='${{ steps.ver.outputs.version }}'
          tmp="$(mktemp)"
          jq --arg v "$v" '.version = $v | .packages[0].version = $v' server.json > "$tmp"
          mv "$tmp" server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Give PyPI a moment to propagate the new version
        run: sleep 15

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
